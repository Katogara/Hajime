# XcodeGen プロジェクト定義 (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
name: Hajime
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hajime:
    type: application
    platform: iOS
    sources:
      - path: Hajime
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Hajime
        INFOPLIST_FILE: Hajime/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  HajimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HajimeTests
    dependencies:
      - target: Hajime
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hajime:
    build:
      targets:
        Hajime: all
    test:
      targets:
        - HajimeTests
